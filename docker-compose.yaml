services:
  playlistapi:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./playlists:/playlists:ro
      - ./media:/media-g:ro
      - /mnt/whiti-h:/media-h:ro
      - ./logs/main:/logs/main:ro
    environment:
      # One per Windows drive letter that appears in playlist/studio file paths
      - MEDIA_ROOT_G=/media-g
      - MEDIA_ROOT_H=/media-h
      # Fallback for drive letters with no MEDIA_ROOT_<LETTER> of their own
      - MEDIA_ROOT=/media-g
      # Studio endpoints — add one per studio using STUDIO_<NAME>_ENDPOINT
      - STUDIO_MAIN_ENDPOINT=http://studio:admin@192.168.1.20:8080/
      # - STUDIO_BACKUP_ENDPOINT=http://studio:admin@192.168.1.22:8080/
      # Studio log directories — add one per studio using STUDIO_<NAME>_LOG_DIR
      - STUDIO_MAIN_LOG_DIR=/logs/main
      # - STUDIO_BACKUP_LOG_DIR=/logs/backup
    restart: unless-stopped
    stop_grace_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
